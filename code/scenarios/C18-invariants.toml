# C18 — Invariants du système. CAS-CANONIQUES §C18.
# Batterie binaire, mode `check`, sans GPU, à chaque commit.
#
# Les assertions vivent ici et non dans le code du harnais : ce fichier est auto-suffisant et
# lisible par quelqu'un qui n'a pas le code sous les yeux (SPEC-003 §3).

[scenario]
id          = "C18-invariants"
t_sim_debut = 1735689600000000   # µs — fixe, donc la houle est identique à chaque exécution
graine      = 20260905

[region]
hs          = 1.2
tp          = 6.0
theta_turns = 0.0
composantes = 32

[check]
grille_cote  = 64
grille_pas_m = 4.0

# Fenêtre d'échantillonnage des mesures statistiques du mode `physics` — ADR-051.
#
# **Distincte de `[check].grille_cote`**, qui sert au hash. Elle était en dur dans `main.rs`
# jusqu'à S62 (A184), alors que ce fichier se déclare auto-suffisant.
#
# 1024 × 3 m = 3072 m, soit 54,7 longueurs d'onde de pic à `tp = 6 s`. À la fenêtre précédente —
# 384 m, 6,8 λ — `Hs` rendait 8,53 % d'écart pour une tolérance de 10 %, et **échouait à
# `tp = 9 s`** ; elle mesurait sa propre taille plus que la chaîne d'amplitude (A102, mesuré S62).
# Ici : 0,282 %. Coût du changement sur `physics` complet : +6 % (33,9 s → 35,9 s).
#
# **Borne dure** : la fenêtre ne peut pas dépasser ±4096 m autour de l'ancre — `to_local` refuse
# au-delà, et le cas compte alors les points perdus et refuse de mesurer (S64).
[physics]
fenetre_cote  = 1024
fenetre_pas_m = 3.0

[assertions]
# I-06 : aucune allocation ne doit réussir après `seal()`. Le harnais en tente une délibérément ;
# elle doit être refusée, et le compteur de refus vaut alors 1, jamais davantage.
allocations = 1
# I-03 : hash de conformité de B. Inscrit à la main, dans un commit qui précède la mesure
# qu'il juge — ADR-028 §4. Une divergence entre plateformes se voit ici.
hash_b      = "0x1a8b0629a9f51b6e"
